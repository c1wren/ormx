[package]
name = "macros"
version = "0.3.1"
authors = ["Caleb Wren <caleb_wren@me.com>"]
edition = "2021"

[lib]
proc-macro = true
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
syn = "3"
quote = "1.0"
proc-macro2 = "1.0"
itertools = "0.15.0"

[dev-dependencies]
syn = { version = "3", features = ["full"] }
